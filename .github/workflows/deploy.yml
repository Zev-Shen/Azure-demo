name: Build, Test & Deploy - CloudNotes

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  ACR_NAME: ${{ secrets.ACR_NAME }}
  APP_SERVICE_NAME: ${{ secrets.APP_SERVICE_NAME }}
  FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/CloudNotes.Api/CloudNotes.Api.csproj
      - run: dotnet publish src/CloudNotes.Api/CloudNotes.Api.csproj -c Release -o ./publish/api --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/api

  build-func:
    name: Build Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet publish src/CloudNotes.Functions/CloudNotes.Functions.csproj -c Release -o ./publish/func
      - name: Package as zip (preserve dotfiles)
        shell: bash
        run: |
          cd ./publish/func
          zip -r ../func-package.zip .
          cd ../..
          echo "=== ZIP contents ==="
          unzip -l ./publish/func-package.zip | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: functions-publish
          path: ./publish/func-package.zip

  test:
    name: Run Tests
    needs: [build-api, build-func]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory ./test-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results

  deploy-api:
    name: Deploy API
    needs: test
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish/api
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          package: ./publish/api

  deploy-func:
    name: Deploy Functions
    needs: test
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-publish
          path: .
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ./func-package.zip

  deploy-report:
    name: Deploy Report
    needs: test
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ env.ACR_NAME }}
      - run: |
          docker build -f docker/Dockerfile -t ${{ env.ACR_NAME }}.azurecr.io/cloudnotes-report:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/cloudnotes-report:${{ github.sha }}
      - uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/cloudnotes-report:${{ github.sha }}
          targetPort: 8080